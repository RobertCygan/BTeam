<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Klienci</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%231f6f8b'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%231f6f8b' opacity='.55'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%231f6f8b' opacity='.55'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%231f6f8b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="xlsx-reader.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Klienci</h1>
      <p class="subtitle" id="subtitle">Wczytywanie danych…</p>
      <p class="source" id="source"></p>
    </div>
    <label class="btn btn-ghost file-btn" title="Wczytaj inny plik .xlsx (albo przeciągnij go na stronę)">
      <input type="file" id="fileInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      <span>Wczytaj plik Excel</span>
    </label>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="text" id="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
               placeholder="Szukaj: nazwisko, inicjały, adres, numer, telefon…" aria-label="Szukaj klientów">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>

      <div class="controls">
        <div class="show-picker">
          <button type="button" class="select-btn" id="showBtn" aria-haspopup="true" aria-expanded="false" aria-controls="showMenu">
            <span class="select-caption">Na kafelkach:</span>
            <span class="select-value" id="showValue">Adres</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <div class="menu" id="showMenu" role="group" aria-label="Co pokazywać na kafelkach" hidden></div>
        </div>

        <label class="select-wrap">
          <span class="select-caption">Kolejność:</span>
          <select id="sort" aria-label="Kolejność kafelków">
            <option value="file">jak w pliku</option>
            <option value="alpha">A–Z wg kafelka</option>
          </select>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </label>

        <label class="switch">
          <input type="checkbox" id="showVacant">
          <span class="switch-track" aria-hidden="true"></span>
          <span>Wolne<span class="hide-sm"> lokale</span> <span class="muted" id="vacantCount"></span></span>
        </label>

        <p class="count" id="count" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="loader is-loading" id="loader">
      <svg class="loader-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="6" width="32" height="36" rx="4"/><path d="M16 18h16M16 26h16M16 34h10"/></svg>
      <h2 id="loaderTitle">Wczytywanie danych…</h2>
      <p id="loaderText"></p>
      <button type="button" class="btn btn-primary" id="pickBtn" hidden>Wybierz plik .xlsx</button>
    </div>

    <ul class="grid" id="grid" aria-label="Klienci"></ul>

    <div class="empty" id="empty" hidden>
      <p id="emptyText">Brak wyników.</p>
      <button type="button" class="btn btn-ghost" id="clearSearch">Wyczyść wyszukiwanie</button>
    </div>
  </main>

  <div class="drop-overlay" aria-hidden="true"><div>Upuść plik Excel, aby go wczytać</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
