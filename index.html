<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Leietakere</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%231f6f8b'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%23e0242f'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%23ffb020'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%231f6f8b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="xlsx-reader.js" defer></script>
  <script src="xlsx-writer.js" defer></script>
  <script src="navn-kjonn.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Leietakere</h1>
      <p class="subtitle" id="subtitle">Laster data…</p>
      <p class="source" id="source"></p>
    </div>
    <div class="top-actions">
      <button type="button" class="btn btn-ghost" id="exportBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
        <span class="hide-sm">Eksporter til Excel</span>
      </button>
      <div class="more">
        <button type="button" class="btn btn-ghost btn-icon" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" aria-label="Flere valg">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
        <div class="menu menu-right" id="moreMenu" hidden>
          <button type="button" class="menu-cmd" id="importCmd">Last inn Excel-fil…</button>
          <button type="button" class="menu-cmd" id="resetCmd">Tilbakestill til innebygde data…</button>
          <p class="menu-hint">Endringer lagres automatisk i denne nettleseren. Bruk «Eksporter til Excel» for å ta en kopi.</p>
        </div>
      </div>
      <input type="file" id="fileInput" class="visually-hidden" tabindex="-1" aria-hidden="true"
             accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="text" id="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
               placeholder="Søk: navn, initialer, adresse, nummer, telefon…" aria-label="Søk etter leietakere">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>

      <div class="controls">
        <div class="show-picker">
          <button type="button" class="select-btn" id="showBtn" aria-haspopup="true" aria-expanded="false" aria-controls="showMenu">
            <span class="select-caption">Vis på kortene:</span>
            <span class="select-value" id="showValue">Adresse</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <div class="menu" id="showMenu" role="group" aria-label="Hva som vises på kortene" hidden></div>
        </div>

        <label class="select-wrap">
          <span class="select-caption">Sorter:</span>
          <select id="sort" aria-label="Rekkefølge på kortene">
            <option value="file">som i filen</option>
            <option value="alpha">A–Å etter kortet</option>
            <option value="ut">kontraktslutt (snarest)</option>
            <option value="reg">KPI-regulering (snarest)</option>
          </select>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </label>

        <label class="switch">
          <input type="checkbox" id="showVacant">
          <span class="switch-track" aria-hidden="true"></span>
          <span>Ledige<span class="hide-sm"> boliger</span> <span class="muted" id="vacantCount"></span></span>
        </label>

        <p class="count" id="count" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="loader is-loading" id="loader">
      <svg class="loader-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="6" width="32" height="36" rx="4"/><path d="M16 18h16M16 26h16M16 34h10"/></svg>
      <h2 id="loaderTitle">Laster data…</h2>
      <p id="loaderText"></p>
      <button type="button" class="btn btn-primary" id="pickBtn" hidden>Velg .xlsx-fil</button>
    </div>

    <section class="overview" id="overview" aria-label="Frister" hidden></section>

    <div class="viewbar" id="viewbar" hidden>
      <div class="seg" role="group" aria-label="Visning">
        <button type="button" id="viewKort" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
          <span>Alle boliger</span>
        </button>
        <button type="button" id="viewGater" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L9 4M20 20L15 4"/><path d="M12 6v2M12 11v2M12 16v2"/></svg>
          <span>Etter gate</span>
        </button>
      </div>
      <nav class="crumbs" id="crumbs" aria-label="Gate" hidden></nav>
      <button type="button" class="btn btn-primary add-btn" id="addBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="add-label">Ny bolig</span>
      </button>
    </div>

    <ul class="grid" id="grid" aria-label="Leietakere"></ul>

    <div class="empty" id="empty" hidden>
      <p id="emptyText">Ingen treff.</p>
      <button type="button" class="btn btn-ghost" id="clearSearch">Tøm søk og filtre</button>
    </div>
  </main>

  <dialog class="editor" id="editor" aria-labelledby="editorTitle">
    <form id="editorForm" novalidate>
      <header class="editor-head">
        <div>
          <h2 id="editorTitle">Rediger bolig</h2>
          <p class="editor-sub" id="editorSub"></p>
        </div>
        <button type="button" class="close" id="editorClose" aria-label="Lukk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="editor-body" id="editorBody"></div>
      <footer class="editor-foot">
        <div class="editor-foot-left">
          <button type="button" class="btn btn-warn" id="vacateBtn" title="Tømmer navn, numre, datoer og merknader – adressen og boligen beholdes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v9H4z"/><path d="M9 20v-5h6v5"/></svg>
            <span>Marker som ledig</span>
          </button>
          <button type="button" class="btn btn-danger-ghost" id="deleteBtn">Slett</button>
        </div>
        <div class="editor-foot-right">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Avbryt</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Lagre</button>
        </div>
      </footer>
    </form>
  </dialog>

  <div class="drop-overlay" aria-hidden="true"><div>Slipp Excel-filen for å laste den inn</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
